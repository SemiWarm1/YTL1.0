<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>报表 - YTL Mall</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="phone-frame merchant-report-page">
      <header class="status-bar">
        <span>19:51</span>
        <div class="status-icons">
          <span>5G</span>
          <span>75%</span>
        </div>
      </header>

      <section class="merchant-report-content">
        <div class="merchant-register-topbar">
          <a class="coupon-detail-back" href="./index2.html" aria-label="返回商户首页">‹</a>
          <div>
            <p class="merchant-register-eyebrow">Merchant Console</p>
            <h1>数据报表</h1>
          </div>
        </div>

        <section class="merchant-report-summary">
          <article class="merchant-report-summary-card">
            <strong>RM 9,700.90</strong>
            <span>营业额</span>
          </article>
          <article class="merchant-report-summary-card">
            <strong>128</strong>
            <span>订单数量</span>
          </article>
        </section>

        <section class="merchant-report-visual">
          <div class="merchant-report-bars" aria-hidden="true">
            <span class="merchant-report-bar merchant-report-bar-gold"></span>
            <span class="merchant-report-bar merchant-report-bar-blue"></span>
            <span class="merchant-report-bar merchant-report-bar-line"></span>
          </div>
        </section>

        <section class="merchant-report-list">
          <article class="merchant-report-item">
            <div class="merchant-report-item-head">
              <strong class="merchant-report-item-title">营业额</strong>
              <span class="merchant-report-item-color merchant-report-item-color-blue"></span>
            </div>
            <div class="merchant-report-metrics">
              <div>
                <strong>RM 2,400</strong>
                <span>今日</span>
              </div>
              <div>
                <strong>RM 0.000</strong>
                <span>营业收入</span>
              </div>
              <div>
                <strong>RM 0.000</strong>
                <span>退款金额</span>
              </div>
            </div>
            <div class="merchant-report-wave merchant-report-wave-blue" aria-hidden="true"></div>
          </article>

          <article class="merchant-report-item">
            <div class="merchant-report-item-head">
              <strong class="merchant-report-item-title">新增会员</strong>
              <span class="merchant-report-item-color merchant-report-item-color-green"></span>
            </div>
            <div class="merchant-report-metrics merchant-report-metrics-single">
              <div>
                <strong>288</strong>
                <span>今日</span>
              </div>
            </div>
            <div class="merchant-report-wave merchant-report-wave-green" aria-hidden="true"></div>
          </article>

          <article class="merchant-report-item">
            <div class="merchant-report-item-head">
              <strong class="merchant-report-item-title">核销优惠券</strong>
              <span class="merchant-report-item-color merchant-report-item-color-purple"></span>
            </div>
            <div class="merchant-report-metrics merchant-report-metrics-single">
              <div>
                <strong>32</strong>
                <span>今日</span>
              </div>
            </div>
            <div class="merchant-report-wave merchant-report-wave-purple" aria-hidden="true"></div>
          </article>
        </section>
      </section>
    </section>
  </main>
  <script src="./script.js"></script>
</body>
</html>
