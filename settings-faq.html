<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>FAQs - YTL Mall</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="phone-frame settings-page">
      <header class="status-bar">
        <span>19:51</span>
        <div class="status-icons">
          <span>5G</span>
          <span>75%</span>
        </div>
      </header>

      <section class="settings-content settings-detail-content">
        <a class="login-back" href="./settings.html">‹ 返回</a>

        <section class="settings-detail-hero">
          <p class="poster-badge">帮助中心</p>
          <h1>FAQs</h1>
          <p>查看会员注册、积分使用、优惠券领取与停车权益等常见问题。</p>
        </section>

        <section class="settings-detail-list">
          <article class="settings-detail-card">
            <h3>如何注册会员？</h3>
            <p>在首页或设置页点击注册，填写手机号、邮箱与基础信息后即可完成会员开通。</p>
          </article>
          <article class="settings-detail-card">
            <h3>积分可以提现吗？</h3>
            <p>当前积分仅支持在商城内兑换奖励、停车券及指定会员活动，不支持提现吗。</p>
          </article>
          <article class="settings-detail-card">
            <h3>优惠券如何使用？</h3>
            <p>领取后可在“奖励”或“我的券包”中查看，结账时向门店出示对应二维码进行核销。</p>
          </article>
          <article class="settings-detail-card">
            <h3>停车券多久生效？</h3>
            <p>停车券兑换成功后通常在 30 分钟内生效，具体以停车系统同步结果为准。</p>
          </article>
        </section>
      </section>
    </section>
  </main>
  <script src="./script.js"></script>
</body>
</html>
