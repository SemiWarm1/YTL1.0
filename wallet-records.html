<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6fb">
  <title>储值变动记录 - YTL Mall</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="phone-frame wallet-records-page">
      <header class="status-bar">
        <span>19:51</span>
        <div class="status-icons">
          <span>5G</span>
          <span>75%</span>
        </div>
      </header>

      <section class="wallet-records-content">
        <div class="wallet-records-topbar">
          <a class="coupon-detail-back" href="./profile.html" aria-label="返回钱包">‹</a>
          <h1>余额明细</h1>
          <span class="coupon-detail-spacer" aria-hidden="true"></span>
        </div>

        <section class="wallet-points-card">
          <div>
            <p>钱包金额</p>
            <strong>1239.00</strong>
          </div>
          <div class="wallet-points-visual" aria-hidden="true">
            <span class="wallet-points-coin wallet-points-coin-top"></span>
            <span class="wallet-points-coin wallet-points-coin-mid"></span>
            <span class="wallet-points-coin wallet-points-coin-bottom"></span>
            <span class="wallet-points-rm">RM</span>
          </div>
        </section>

        <div class="wallet-records-range">
          <span class="wallet-records-calendar" aria-hidden="true"></span>
          <span>日期筛选条件</span>
        </div>

        <section class="wallet-records-panel">
          <h2>储值变动记录</h2>

          <article class="wallet-record-item">
            <div class="wallet-record-main">
              <span class="wallet-record-icon wallet-record-icon-plus">□</span>
              <div class="wallet-record-copy">
                <h3>充值</h3>
                <p>2021-07-15 12:35:49</p>
              </div>
            </div>
            <div class="wallet-record-meta">
              <strong class="wallet-record-value is-positive">+10</strong>
              <p>剩余积分 1850</p>
            </div>
          </article>

          <article class="wallet-record-item">
            <div class="wallet-record-main">
              <span class="wallet-record-icon wallet-record-icon-plus">□</span>
              <div class="wallet-record-copy">
                <h3>充值</h3>
                <p>2021-07-15 12:35:49</p>
              </div>
            </div>
            <div class="wallet-record-meta">
              <strong class="wallet-record-value is-positive">+10</strong>
              <p>剩余积分 1850</p>
            </div>
          </article>

          <article class="wallet-record-item">
            <div class="wallet-record-main">
              <span class="wallet-record-icon wallet-record-icon-minus">RM</span>
              <div class="wallet-record-copy">
                <h3>消费</h3>
                <p>2021-07-15 12:35:49</p>
              </div>
            </div>
            <div class="wallet-record-meta">
              <strong class="wallet-record-value is-negative">−10</strong>
              <p>剩余积分 1850</p>
            </div>
          </article>
        </section>
      </section>
    </section>
  </main>
  <script src="./script.js"></script>
</body>
</html>
