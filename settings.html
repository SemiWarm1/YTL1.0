<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>设置 - YTL Mall</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="phone-frame settings-page">
      <header class="status-bar">
        <span>19:51</span>
        <div class="status-icons">
          <span>5G</span>
          <span>75%</span>
        </div>
      </header>

      <section class="settings-content">
        <div class="drawer-header">
          <div class="drawer-user">
            <div class="drawer-avatar">YTL</div>
            <div class="drawer-user-meta">
              <p class="drawer-name" data-cn="YTL 会员" data-en="YTL Member">YTL 会员</p>
              <p class="drawer-subtitle" data-cn="登录后查看积分与专属礼遇" data-en="Sign in to view points and exclusive benefits">登录后查看积分与专属礼遇</p>
            </div>
          </div>
          <a class="drawer-close" href="./index.html" aria-label="关闭设置">×</a>
        </div>

        <div class="settings-contact-actions settings-role-switch" role="tablist" aria-label="角色切换">
          <button class="settings-contact-button is-active" type="button" data-role="user" data-cn="用户端" data-en="User Side">用户端</button>
          <a class="settings-contact-button settings-contact-link" href="./index2.html" data-role="merchant" data-cn="商户端" data-en="Merchant Side">商户端</a>
        </div>

        <nav class="drawer-menu settings-menu is-active" aria-label="用户端菜单" data-role-panel="user">
          <a class="drawer-item" href="./settings-faq.html">
            <span data-cn="FAQs" data-en="FAQs">FAQs</span>
            <span>›</span>
          </a>
          <a class="drawer-item" href="./settings-terms.html">
            <span data-cn="条款与隐私页面" data-en="Terms & Privacy Pages">条款与隐私页面</span>
            <span>›</span>
          </a>
          <a class="drawer-item" href="./settings-contact.html">
            <span data-cn="联系我们" data-en="Contact Us">联系我们</span>
            <span>›</span>
          </a>
        </nav>

        <div class="language-switcher">
          <button class="language-button is-active" type="button" data-lang="zh">中文</button>
          <button class="language-button" type="button" data-lang="en">EN</button>
        </div>
      </section>
    </section>
  </main>

  <script src="./script.js"></script>
</body>
</html>
