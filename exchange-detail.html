<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>兑换详情 - YTL Mall</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="phone-frame">
      <header class="status-bar">
        <span>19:51</span>
        <div class="status-icons">
          <span>5G</span>
          <span>75%</span>
        </div>
      </header>

      <section class="store-detail-content reward-detail-content">
        <a class="login-back" href="./rewards.html">‹ 返回</a>

        <section class="store-detail-info reward-detail-panel">
          <h1>停车券</h1>

          <div class="store-detail-list">
            <article class="store-detail-row">
              <span>兑换活动名称</span>
              <strong>停车券兑换</strong>
            </article>
            <article class="store-detail-row">
              <span>所需积分</span>
              <strong>3,000 积分</strong>
            </article>
            <article class="store-detail-row">
              <span>兑换时间范围</span>
              <strong>2026.05.28 - 2026.06.14</strong>
            </article>
            <article class="store-detail-row">
              <span>适用门店</span>
              <strong>全部门店</strong>
            </article>
            <article class="store-detail-row reward-detail-rule">
              <span>兑换规则</span>
              <p class="reward-rule-copy">需提供车辆号码和 IU 编号才能领取停车 e-Voucher，可在停车场 B 区客服柜台办理。会员每次最多只能兑换价值 3 美元的停车费。WA Carpark 5 的有效期为兑换后 6 个月。兑换流程最多需要 30 分钟。</p>
            </article>
          </div>
        </section>
      </section>

      <div class="exchange-action-bar">
        <button class="exchange-primary-button" type="button">兑换</button>
      </div>
    </section>
  </main>
  <script src="./script.js"></script>
</body>
</html>
