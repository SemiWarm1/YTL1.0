<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>卡券详情 - YTL Mall</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="phone-frame coupon-detail-page">
      <header class="status-bar">
        <span>19:51</span>
        <div class="status-icons">
          <span>5G</span>
          <span>75%</span>
        </div>
      </header>

      <section class="coupon-detail-content">
        <div class="coupon-detail-topbar">
          <a class="coupon-detail-back" href="./rewards.html" aria-label="返回优惠券">‹</a>
          <h1>卡券详情</h1>
          <span class="coupon-detail-spacer" aria-hidden="true"></span>
        </div>

        <section class="coupon-detail-summary">
          <h2>5元无门槛优惠券</h2>
          <p>领取时间：2026.01.01 ~ 2026.02.28</p>
        </section>

        <section class="coupon-detail-panel">
          <article class="coupon-detail-item">
            <h3>优惠金额</h3>
            <p>RM 5.00</p>
          </article>
          <article class="coupon-detail-item">
            <h3>可用对象</h3>
            <p>全部用户</p>
          </article>
          <article class="coupon-detail-item">
            <h3>使用说明</h3>
            <p>此优惠券可直接在参与活动的门店使用，结账时出示卡券二维码即可抵扣 RM 5，不限制最低消费金额。</p>
          </article>
          <article class="coupon-detail-item">
            <h3>有效期</h3>
            <p>有效期：2026.01.01–2026.02.29</p>
          </article>
        </section>
      </section>

      <div class="exchange-action-bar coupon-claim-bar">
        <button class="exchange-primary-button" type="button">领取</button>
      </div>
    </section>
  </main>
  <script src="./script.js"></script>
</body>
</html>
