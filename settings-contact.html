<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>联系我们 - YTL Mall</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="phone-frame settings-page">
      <header class="status-bar">
        <span>19:51</span>
        <div class="status-icons">
          <span>5G</span>
          <span>75%</span>
        </div>
      </header>

      <section class="settings-content settings-detail-content">
        <a class="login-back" href="./settings.html">‹ 返回</a>

        <section class="settings-detail-hero">
          <p class="poster-badge">客户支持</p>
          <h1>联系我们</h1>
          <p>如需会员帮助、优惠券咨询、停车权益协助或投诉建议，可通过以下方式联系。</p>
        </section>

        <section class="settings-detail-list">
          <article class="settings-detail-card">
            <h3>客服热线</h3>
            <p>+60 3 2788 8899</p>
          </article>
          <article class="settings-detail-card">
            <h3>客服邮箱</h3>
            <p>support@ytlmall.com</p>
          </article>
          <article class="settings-detail-card">
            <h3>服务时间</h3>
            <p>周一至周日 10:00 - 22:00，节假日与商场营业时间同步。</p>
          </article>
          <article class="settings-detail-card">
            <h3>服务台地址</h3>
            <p>YTL Mall 一层中央服务台，支持会员咨询、停车券与活动权益处理。</p>
          </article>
        </section>
      </section>
    </section>
  </main>
  <script src="./script.js"></script>
</body>
</html>
