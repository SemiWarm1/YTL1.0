<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>奖励领取记录 - YTL Mall</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="phone-frame reward-history-page">
      <header class="status-bar">
        <span>19:51</span>
        <div class="status-icons">
          <span>5G</span>
          <span>75%</span>
        </div>
      </header>

      <section class="reward-history-content">
        <div class="wallet-records-topbar">
          <a class="coupon-detail-back" href="./profile.html" aria-label="返回钱包">‹</a>
          <h1>奖励领取记录</h1>
          <span class="coupon-detail-spacer" aria-hidden="true"></span>
        </div>

        <section class="reward-history-panel">
          <article class="reward-history-item">
            <span>领取奖励名称</span>
            <strong>停车券</strong>
            <span>领取记录</span>
            <strong>2026-05-20 14:30:28</strong>
            <span>消费积分</span>
            <strong>3,000 积分</strong>
          </article>

          <article class="reward-history-item">
            <span>领取奖励名称</span>
            <strong>全场优惠10%</strong>
            <span>领取记录</span>
            <strong>2026-05-18 11:05:44</strong>
            <span>消费积分</span>
            <strong>1,200 积分</strong>
          </article>

          <article class="reward-history-item">
            <span>领取奖励名称</span>
            <strong>会员欢迎礼券</strong>
            <span>领取记录</span>
            <strong>2026-05-12 19:16:09</strong>
            <span>消费积分</span>
            <strong>800 积分</strong>
          </article>
        </section>
      </section>
    </section>
  </main>
  <script src="./script.js"></script>
</body>
</html>
