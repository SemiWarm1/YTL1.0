<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>登录 - YTL Mall</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="phone-frame login-page">
      <header class="status-bar">
        <span>19:51</span>
        <div class="status-icons">
          <span>5G</span>
          <span>75%</span>
        </div>
      </header>

      <section class="login-content">
        <a class="login-back" href="./index.html">‹ 返回</a>
        <div class="login-brand-block">
          <p class="brand-cn">YTL Mall</p>
          <p class="brand-en">一站式综合商场</p>
        </div>

        <form class="login-form">
          <label class="field-group">
            <span>手机号</span>
            <input class="text-input" type="tel" inputmode="numeric" placeholder="请输入手机号">
          </label>
          <label class="field-group">
            <span>密码</span>
            <input class="text-input" type="password" placeholder="请输入密码">
          </label>
          <button class="solid-button login-submit" type="button">登录</button>
        </form>
      </section>

      <div class="login-guest-bar">
        <a class="guest-button" href="./index.html">Browse as a guest</a>
      </div>
    </section>
  </main>
  <script src="./script.js"></script>
</body>
</html>
