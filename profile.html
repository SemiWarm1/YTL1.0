<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>我的 - YTL Mall</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="phone-frame">
      <header class="status-bar">
        <span>19:51</span>
        <div class="status-icons">
          <span>5G</span>
          <span>75%</span>
        </div>
      </header>

      <div class="app-content">
        <section class="screen is-active" data-screen="profile">
          <section class="content-section content-section-tight">
            <article class="wallet-hero-card">
              <div class="wallet-topline">
                <div class="wallet-user">
                  <div class="wallet-user-avatar">J</div>
                  <p>Hi, James Dean</p>
                </div>
                <a class="wallet-bell action-link" href="./member-level.html" aria-label="会员等级">Lv.6</a>
              </div>

              <div class="wallet-balance-block">
                <p class="wallet-balance-label">钱包余额</p>
                <h1>RM 140,371.39</h1>
              </div>

              <div class="wallet-action-pills">
                <span class="wallet-points-badge">231 point</span>
                <span class="wallet-pill">优惠券 3张</span>
                <span class="wallet-pill wallet-pill-outline">充值</span>
              </div>
            </article>

            <section class="wallet-section">
              <h2>核心功能</h2>
              <div class="wallet-shortcuts">
                <a class="wallet-shortcut-card" href="./reward-history.html">
                  <span class="wallet-shortcut-icon">◎</span>
                  <span>奖励</span>
                </a>
                <a class="wallet-shortcut-card" href="./my-coupons.html">
                  <span class="wallet-shortcut-icon">券</span>
                  <span>优惠券</span>
                </a>
                <a class="wallet-shortcut-card" href="./wallet-records.html">
                  <span class="wallet-shortcut-icon">≡</span>
                  <span>余额变动</span>
                </a>
                <a class="wallet-shortcut-card" href="./member-profile.html">
                  <span class="wallet-shortcut-icon">◫</span>
                  <span>资料</span>
                </a>
              </div>
            </section>
          </section>
        </section>
      </div>

      <nav class="bottom-nav" aria-label="底部导航">
        <a class="nav-item" href="./index.html">
          <span class="nav-icon">⌂</span>
          <span>首页</span>
        </a>
        <a class="nav-item" href="./stores.html">
          <span class="nav-icon">⌘</span>
          <span>发现</span>
        </a>
        <a class="nav-item" href="./rewards.html">
          <span class="nav-icon">◎</span>
          <span>奖励</span>
        </a>
        <a class="nav-item is-active" href="./profile.html">
          <span class="nav-icon">◫</span>
          <span>钱包</span>
        </a>
      </nav>
    </section>
  </main>
  <script src="./script.js"></script>
</body>
</html>
