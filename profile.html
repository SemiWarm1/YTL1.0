<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>我的 - YTL Mall</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="phone-frame">
      <header class="status-bar">
        <span>19:51</span>
        <div class="status-icons">
          <span>5G</span>
          <span>75%</span>
        </div>
      </header>

      <div class="app-content">
        <section class="screen is-active" data-screen="profile">
          <section class="content-section content-section-tight">
            <article class="wallet-hero-card">
              <div class="wallet-topline">
                <div class="wallet-user">
                  <div class="wallet-user-avatar">J</div>
                  <p>Hi, James Dean</p>
                </div>
                <div class="wallet-level-summary">
                  <a class="wallet-bell action-link" href="./member-level.html" aria-label="会员等级">Lv.6</a>
                  <a class="wallet-level-progress action-link" href="./member-level.html" aria-label="会员等级进度">
                    <div class="wallet-level-progress-track">
                      <span class="wallet-level-progress-fill" style="width: 70%;"></span>
                    </div>
                    <p>70% 到 Lv.7</p>
                  </a>
                </div>
              </div>

              <div class="wallet-balance-block">
                <p class="wallet-balance-label">钱包余额</p>
                <h1>RM 140,371.39</h1>
              </div>

              <div class="wallet-action-pills">
                <a class="wallet-points-badge action-link" href="./points-records.html">231 point</a>
                <span class="wallet-pill">优惠券 3张</span>
                <a class="wallet-pill wallet-pill-outline action-link" href="./top-up.html">充值</a>
              </div>
            </article>

            <section class="wallet-section">
              <div class="section-heading section-heading-left">
                <div>
                  <h2>会员条码</h2>
                </div>
              </div>
              <a class="member-code-card" href="./member-code.html" aria-label="查看会员二维码">
                <div class="member-code-card-top">
                  <div class="member-code-barcode" aria-hidden="true">
                    <span class="member-code-barcode-stripes"></span>
                  </div>
                  <span class="member-code-qr-chip">⌘</span>
                </div>
                <div class="member-code-card-bottom">
                  <strong>1780572997298986508</strong>
                  <span class="member-code-copy-icon" aria-hidden="true">◫</span>
                </div>
              </a>
            </section>

            <section class="wallet-section">
              <h2>核心功能</h2>
              <div class="wallet-shortcuts">
                <a class="wallet-shortcut-card" href="./reward-history.html">
                  <span class="wallet-shortcut-icon">◎</span>
                  <span>奖励</span>
                </a>
                <a class="wallet-shortcut-card" href="./my-coupons.html">
                  <span class="wallet-shortcut-icon" aria-hidden="true">◌</span>
                  <span>优惠券</span>
                </a>
                <a class="wallet-shortcut-card" href="./wallet-records.html">
                  <span class="wallet-shortcut-icon">≡</span>
                  <span>余额变动</span>
                </a>
                <a class="wallet-shortcut-card" href="./member-profile.html">
                  <span class="wallet-shortcut-icon">◫</span>
                  <span>资料</span>
                </a>
              </div>
            </section>

            <section class="wallet-section wallet-logout-section">
              <a class="wallet-logout-button" href="./index.html" data-cn="退出登录" data-en="Log Out">退出登录</a>
            </section>
          </section>
        </section>
      </div>

      <nav class="bottom-nav" aria-label="底部导航">
        <a class="nav-item" href="./index.html">
          <span class="nav-icon">⌂</span>
          <span>首页</span>
        </a>
        <a class="nav-item" href="./stores.html">
          <span class="nav-icon">⌘</span>
          <span>发现</span>
        </a>
        <a class="nav-item" href="./rewards.html">
          <span class="nav-icon">◎</span>
          <span>奖励</span>
        </a>
        <a class="nav-item is-active" href="./profile.html">
          <span class="nav-icon">◫</span>
          <span>钱包</span>
        </a>
      </nav>
    </section>
  </main>
  <script src="./script.js"></script>
</body>
</html>
