<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fffdf9">
  <title>个人信息 - YTL Mall</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="phone-frame merchant-profile-page">
      <header class="status-bar">
        <span>19:51</span>
        <div class="status-icons">
          <span>5G</span>
          <span>75%</span>
        </div>
      </header>

      <section class="merchant-profile-content">
        <div class="merchant-profile-topbar">
          <a class="coupon-detail-back" href="./index2.html" aria-label="返回商户首页">‹</a>
          <h1>个人信息</h1>
          <button class="merchant-profile-edit-button" id="merchant-profile-toggle" type="button">修改</button>
        </div>

        <section class="merchant-profile-panel merchant-profile-panel-merchant">
          <label class="field-group">
            <span>账号所属门店</span>
            <input class="text-input merchant-profile-input is-locked" type="text" value="YTL Mall 美妆馆" readonly data-locked="true">
          </label>

          <label class="field-group">
            <span>姓名</span>
            <input class="text-input merchant-profile-input" type="text" value="Tom" readonly>
          </label>

          <label class="field-group">
            <span>角色</span>
            <input class="text-input merchant-profile-input is-locked" type="text" value="店长" readonly data-locked="true">
          </label>

          <label class="field-group">
            <span>手机号</span>
            <input class="text-input merchant-profile-input" type="tel" value="+60 12-345 6789" readonly>
          </label>

          <label class="field-group">
            <span>邮箱</span>
            <input class="text-input merchant-profile-input" type="email" value="tom.manager@ytlmall.com" readonly>
          </label>
        </section>
      </section>
    </section>
  </main>

  <script>
    const merchantProfileToggle = document.getElementById("merchant-profile-toggle");
    const merchantProfileInputs = document.querySelectorAll(".merchant-profile-input");
    let merchantProfileEditing = false;

    merchantProfileToggle?.addEventListener("click", () => {
      merchantProfileEditing = !merchantProfileEditing;
      merchantProfileToggle.textContent = merchantProfileEditing ? "完成" : "修改";

      merchantProfileInputs.forEach((input) => {
        const locked = input.dataset.locked === "true";
        input.readOnly = locked || !merchantProfileEditing;
        input.classList.toggle("is-editing", merchantProfileEditing && !locked);
      });
    });
  </script>
  <script src="./script.js"></script>
</body>
</html>
