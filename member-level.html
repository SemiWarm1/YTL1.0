<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fffdf9">
  <title>会员等级 - YTL Mall</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="phone-frame member-level-page">
      <header class="status-bar">
        <span>19:51</span>
        <div class="status-icons">
          <span>5G</span>
          <span>75%</span>
        </div>
      </header>

      <section class="member-level-content">
        <div class="merchant-register-topbar">
          <a class="coupon-detail-back" href="./profile.html" aria-label="返回钱包">‹</a>
          <div>
            <p class="merchant-register-eyebrow">Membership Level</p>
            <h1>会员等级</h1>
          </div>
        </div>

        <section class="member-level-growth">
          <div class="member-level-growth-top">
            <div>
              <p>今日成长值</p>
              <strong>+30</strong>
            </div>
            <a class="member-level-rule-link" href="./settings.html">会员规则 ›</a>
          </div>

          <div class="member-level-arc" aria-hidden="true">
            <div class="member-level-arc-line"></div>
            <span class="member-level-point member-level-point-v1">V1</span>
            <span class="member-level-point member-level-point-v2">V2</span>
            <span class="member-level-point member-level-point-v3">V3</span>
            <span class="member-level-point member-level-point-v4">V4</span>
            <span class="member-level-point member-level-point-v5">V5</span>
            <span class="member-level-point member-level-point-v6 is-active">V6</span>
            <span class="member-level-point member-level-point-v7">V7</span>
            <span class="member-level-point member-level-point-v8">V8</span>
          </div>

          <div class="member-level-score">
            <strong>42890</strong>
            <span>成长值</span>
          </div>
        </section>

        <section class="member-level-card">
          <div class="member-level-card-copy">
            <p class="member-level-card-tag">SVIP V6</p>
            <h2>当前等级</h2>
            <p class="member-level-card-progress-copy">升级还需 <strong>110</strong> 成长值</p>

            <div class="member-level-progress">
              <span class="member-level-progress-bar"></span>
            </div>

            <div class="member-level-progress-range">
              <span>V6</span>
              <span>V7</span>
            </div>
          </div>

          <div class="member-level-card-visual" aria-hidden="true">
            <div class="member-level-orbit"></div>
            <div class="member-level-core">V6</div>
          </div>

          <button class="member-level-boost-button" type="button">立即加速</button>
        </section>
      </section>
    </section>
  </main>
  <script src="./script.js"></script>
</body>
</html>
