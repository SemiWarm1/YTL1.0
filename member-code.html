<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>会员码 - YTL Mall</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="phone-frame member-code-page">
      <header class="status-bar">
        <span>19:51</span>
        <div class="status-icons">
          <span>5G</span>
          <span>75%</span>
        </div>
      </header>

      <section class="member-code-content">
        <div class="merchant-register-topbar">
          <a class="coupon-detail-back" href="./profile.html" aria-label="返回钱包">‹</a>
          <h1>会员码</h1>
          <span class="coupon-detail-spacer" aria-hidden="true"></span>
        </div>

        <section class="member-code-panel">
          <div class="member-code-qr-block">
            <img class="member-code-qr-image" src="./assets/member-qr.png" alt="会员二维码">
          </div>

          <div class="member-code-full-barcode" aria-hidden="true">
            <span class="member-code-barcode-stripes"></span>
          </div>

          <div class="member-code-number">
            <strong>1780572997298986508</strong>
            <span class="member-code-copy-icon" aria-hidden="true">◫</span>
          </div>

          <div class="member-code-timer">
            <div class="member-code-timer-ring" id="member-code-timer-ring" aria-hidden="true"></div>
            <span id="member-code-timer-text">01:00</span>
          </div>
        </section>
      </section>
    </section>
  </main>
  <script src="./script.js"></script>
  <script>
    (function () {
      const totalSeconds = 60;
      const timerText = document.getElementById("member-code-timer-text");
      const timerRing = document.getElementById("member-code-timer-ring");

      if (!timerText || !timerRing) return;

      let remaining = totalSeconds;

      function renderTimer(seconds) {
        const minutes = String(Math.floor(seconds / 60)).padStart(2, "0");
        const secs = String(seconds % 60).padStart(2, "0");
        const progress = (seconds / totalSeconds) * 360;

        timerText.textContent = `${minutes}:${secs}`;
        timerRing.style.background =
          `conic-gradient(#172033 0deg ${progress}deg, rgba(23, 32, 51, 0.16) ${progress}deg 360deg)`;
      }

      renderTimer(remaining);

      window.setInterval(function () {
        remaining -= 1;
        if (remaining < 0) {
          remaining = totalSeconds;
        }
        renderTimer(remaining);
      }, 1000);
    })();
  </script>
</body>
</html>
