<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>条款与隐私 - YTL Mall</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="phone-frame settings-page">
      <header class="status-bar">
        <span>19:51</span>
        <div class="status-icons">
          <span>5G</span>
          <span>75%</span>
        </div>
      </header>

      <section class="settings-content settings-detail-content">
        <a class="login-back" href="./settings.html">‹ 返回</a>

        <section class="settings-detail-hero">
          <p class="poster-badge">法律与隐私</p>
          <h1>条款与隐私页面</h1>
          <p>了解会员服务使用条款、数据使用说明与隐私保护政策。</p>
        </section>

        <section class="settings-detail-list">
          <article class="settings-detail-card">
            <h3>会员服务条款</h3>
            <p>会员账户仅限本人使用，积分、奖励和优惠权益需在有效期内使用，不得转售或违规转让。</p>
          </article>
          <article class="settings-detail-card">
            <h3>隐私说明</h3>
            <p>我们仅在提供会员服务、奖励发放、通知提醒和运营优化所需范围内收集并使用你的信息。</p>
          </article>
          <article class="settings-detail-card">
            <h3>数据安全</h3>
            <p>平台采用加密传输与权限控制机制保护账户、手机号、邮箱及交易相关信息。</p>
          </article>
          <article class="settings-detail-card">
            <h3>政策更新</h3>
            <p>如条款或隐私政策发生更新，我们会通过 App 消息、活动页或设置页进行同步公告。</p>
          </article>
        </section>
      </section>
    </section>
  </main>
  <script src="./script.js"></script>
</body>
</html>
